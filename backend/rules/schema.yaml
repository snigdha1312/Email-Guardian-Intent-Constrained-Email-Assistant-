$schema: "http://json-schema.org/draft-07/schema#"
title: "EmailPolicyRules"
type: "object"
properties:
  scope:
    type: "string"
    description: "Free text describing what this identity is for, shown in the audit log for readability."
  max_actions_per_day:
    type: "integer"
    description: "Integer cap shared across all actions for that identity."
  rules:
    type: "array"
    items:
      type: "object"
      required:
        - action
      properties:
        action:
          type: "string"
          enum: ["send_email", "archive_thread", "schedule_followup", "draft_reply"]
        allowed_domains:
          type: "array"
          items:
            type: "string"
          description: "List of domains this identity may send to. If not specified, defaults to empty list."
        denied_domains:
          type: "array"
          items:
            type: "string"
          description: "List of domains explicitly blocked, takes priority over allowed."
        requires_existing_thread:
          type: "boolean"
          description: "True means it can only reply within a thread that already exists, not start new conversations."
